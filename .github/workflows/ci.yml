name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install ruff
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: |
          for file in src/*.js; do
            node --check "$file"
          done
