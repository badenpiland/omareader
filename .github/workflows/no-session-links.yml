name: No session links

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commits and description
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          fail=0
          session='^Claude-Session:|claude\.ai/code/session_'
          if git log --format='%H%n%B' "$BASE..$HEAD" | grep -n -E "$session"; then
            echo "::error::A commit in this pull request links a Claude session. Remove the Claude-Session line or link."
            fail=1
          fi
          if printf '%s\n%s\n' "$TITLE" "$BODY" | grep -n -E "$session"; then
            echo "::error::The pull request title or description links a Claude session."
            fail=1
          fi
          if printf '%s\n' "$BODY" | grep -n -E 'claude\.ai/code/project/'; then
            echo "::warning::The description links a Claude project thread. The project setup adds this line, so it is flagged rather than failed. Edit it out if you don't want it."
          fi
          exit $fail
