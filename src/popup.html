<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Omareader</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <img id="logo" src="icon-dark.svg" width="30" height="30" alt="" />
        <h1>omareader</h1>
      </div>
      <p id="theme">Waiting for Omarchy</p>
    </header>
    <main>
      <button id="enabled" type="button" class="switch" aria-keyshortcuts="Alt+Shift+O">
        <span class="ico power" aria-hidden="true"></span>
        <span id="enabled-label">disable everywhere</span>
        <span class="keys" aria-hidden="true">alt+shift+o</span>
      </button>
      <button id="site" type="button" class="switch" aria-keyshortcuts="Alt+Shift+U" hidden>
        <span class="ico power" aria-hidden="true"></span>
        <span id="site-label">disable this site</span>
        <span class="keys" aria-hidden="true">alt+shift+u</span>
      </button>
    </main>
    <p id="status" hidden></p>
    <section id="dark-reader" hidden>
      <p id="dark-reader-text">Dark Reader is also on. Both extensions restyle the page. Turn Dark Reader off?</p>
      <div class="choices">
        <button id="dark-reader-off" type="button">Turn it off</button>
        <button id="dark-reader-keep" type="button">Leave it on</button>
      </div>
    </section>
    <footer>
      <label class="fixes">
        <input id="site-fixes" type="checkbox" checked />
        <span>fetch site fixes daily</span>
      </label>
      <p id="update"><span id="update-installed"></span><a id="update-available" hidden target="_blank" rel="noreferrer"></a></p>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
