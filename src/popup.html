<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Omareader</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icon-dark-32.png" width="20" height="20" alt="" />
      <h1>omareader</h1>
      <p id="update"><span id="update-installed"></span><a id="update-available" hidden target="_blank" rel="noreferrer"></a></p>
    </header>
    <section>
      <p class="label"><span>All sites</span><span class="keys" title="Alt+Shift+O turns every site Normal and back">alt+shift+o</span></p>
      <div class="modes" id="modes" role="radiogroup" aria-label="Mode for all sites" aria-keyshortcuts="Alt+Shift+O">
        <button type="button" role="radio" data-mode="normal" title="Pages as they are">Normal</button>
        <button type="button" role="radio" data-mode="dark" title="Pitch black, page colors keep their hue">Dark</button>
        <button type="button" role="radio" data-mode="omarchy" title="Follow your current Omarchy theme">Follow Omarchy</button>
      </div>
      <p class="label"><span id="site">Not available on this page</span><span class="keys" id="site-keys" title="Alt+Shift+U turns this site Normal and back">alt+shift+u</span></p>
      <div class="modes" id="site-modes" role="radiogroup" aria-label="Mode on this site" aria-keyshortcuts="Alt+Shift+U">
        <button type="button" role="radio" data-mode="default">Default</button>
        <button type="button" role="radio" data-mode="normal" title="Always as it is">Normal</button>
        <button type="button" role="radio" data-mode="dark" title="Always pitch black">Dark</button>
        <button type="button" role="radio" data-mode="omarchy" title="Always follow your Omarchy theme">Omarchy</button>
      </div>
      <div id="swatches" class="swatches" aria-hidden="true"></div>
      <label class="fixes">
        <input id="site-fixes" type="checkbox" checked />
        <span>Fetch site fixes daily</span>
      </label>
    </section>
    <section id="dark-reader" hidden>
      <p id="dark-reader-text">Dark Reader is also on. Both extensions restyle the page. Turn Dark Reader off?</p>
      <div class="choices">
        <button id="dark-reader-off" type="button">Turn it off</button>
        <button id="dark-reader-keep" type="button">Leave it on</button>
      </div>
    </section>
    <footer id="status">Waiting for Omarchy</footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
