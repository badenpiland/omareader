<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Omareader</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>omareader</h1>
      <label class="switch">
        <input id="enabled" type="checkbox" />
        <span id="enabled-label">On</span>
      </label>
    </header>
    <p id="theme">Waiting for Omarchy</p>
    <button id="site" type="button" hidden>Pause on this site</button>
    <p id="status" hidden></p>
    <section id="dark-reader" hidden>
      <p id="dark-reader-text">Dark Reader is also on. Both extensions restyle the page. Turn Dark Reader off?</p>
      <div class="choices">
        <button id="dark-reader-off" type="button">Turn it off</button>
        <button id="dark-reader-keep" type="button">Leave it on</button>
      </div>
    </section>
    <label class="fixes">
      <input id="site-fixes" type="checkbox" checked />
      <span>Update site fixes daily</span>
    </label>
    <p id="update"><span id="update-installed"></span><a id="update-available" hidden target="_blank" rel="noreferrer"></a></p>
    <details id="details" hidden>
      <summary>Details</summary>
      <p id="site-line" hidden><span class="k">Site</span> <span id="site-host"></span></p>
      <div class="swatches" hidden>
        <div>
          <span class="k">Background</span>
          <i id="bg"></i>
          <span id="bg-label"></span>
        </div>
        <div>
          <span class="k">Foreground</span>
          <i id="fg"></i>
          <span id="fg-label"></span>
        </div>
      </div>
    </details>
    <script type="module" src="popup.js"></script>
  </body>
</html>
