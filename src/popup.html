<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Omareader</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>omareader</h1>
      <label class="switch">
        <span id="enabled-label">On</span>
        <input id="enabled" type="checkbox" />
      </label>
    </header>
    <p class="line">
      <span class="k">Theme</span>
      <span id="theme">Waiting for Omarchy</span>
    </p>
    <button id="site" type="button" hidden>Pause on this site</button>
    <p id="status" hidden></p>
    <section id="dark-reader" hidden>
      <p id="dark-reader-text">Dark Reader is also on. Both extensions restyle the page. Turn Dark Reader off?</p>
      <div class="choices">
        <button id="dark-reader-off" type="button">Turn it off</button>
        <button id="dark-reader-keep" type="button">Leave it on</button>
      </div>
    </section>
    <details id="details">
      <summary>Details</summary>
      <div class="rows">
        <p id="site-line" class="pair" hidden><span class="k">site:</span> <span id="site-host"></span></p>
        <div class="swatches" hidden>
          <div class="pair">
            <span class="k">background:</span>
            <span class="v"><i id="bg"></i><span id="bg-label"></span></span>
          </div>
          <div class="pair">
            <span class="k">foreground:</span>
            <span class="v"><i id="fg"></i><span id="fg-label"></span></span>
          </div>
        </div>
        <label class="fixes">
          <input id="site-fixes" type="checkbox" checked />
          <span>Fetch site fixes daily</span>
        </label>
      </div>
    </details>
    <p id="update"><span id="update-installed"></span><a id="update-available" hidden target="_blank" rel="noreferrer"></a></p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
