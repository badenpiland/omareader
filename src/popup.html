<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Omareader</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Omareader</h1>
      <label class="switch">
        <input id="enabled" type="checkbox" />
        <span>On</span>
      </label>
    </header>
    <p id="theme">Waiting for Omarchy</p>
    <p id="status"></p>
    <div class="swatches" hidden>
      <div>
        <i id="bg"></i>
        <span id="bg-label"></span>
      </div>
      <div>
        <i id="fg"></i>
        <span id="fg-label"></span>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
