<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Omareader</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Omareader</h1>
      <label class="switch">
        <input id="enabled" type="checkbox" />
        <span id="enabled-label">On</span>
      </label>
    </header>
    <p id="site-host" hidden></p>
    <button id="site" type="button" hidden>Pause on this site</button>
    <p id="theme">Waiting for Omarchy</p>
    <p id="status"></p>
    <section id="dark-reader" hidden>
      <p id="dark-reader-text">Dark Reader is also on. Both extensions restyle the page. Turn Dark Reader off?</p>
      <div class="choices">
        <button id="dark-reader-off" type="button">Turn it off</button>
        <button id="dark-reader-keep" type="button">Leave it on</button>
      </div>
    </section>
    <label class="fixes">
      <input id="site-fixes" type="checkbox" checked />
      <span>Update site fixes daily</span>
    </label>
    <div class="swatches" hidden>
      <div>
        <i id="bg"></i>
        <span id="bg-label"></span>
      </div>
      <div>
        <i id="fg"></i>
        <span id="fg-label"></span>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
